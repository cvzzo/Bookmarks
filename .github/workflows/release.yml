# Builds a signed release APK for every pushed tag and publishes it as a GitHub Release.
#
#   git tag v1.2.0 && git push origin v1.2.0   ->   Release "v1.2.0" with Bookmarks-v1.2.0.apk
#
# Signing secrets (Settings -> Secrets and variables -> Actions):
#   SIGNING_KEYSTORE_BASE64   base64 of the release keystore (PKCS12)
#   SIGNING_PASSWORD          keystore and key password
# Without them the APK is signed with a throwaway debug key: installable, but it can't update
# an app signed with the real key.
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets missing: the APK will be signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.p12"
            echo "SIGNING_STORE_PASSWORD=$PASSWORD"
            echo "SIGNING_KEY_ALIAS=bookmarks"
            echo "SIGNING_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test and build
        # "v1.2.0" -> versionName "1.2.0"; versionCode grows with every run.
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" \
            -PversionCode="${{ github.run_number }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="Bookmarks-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --generate-notes
